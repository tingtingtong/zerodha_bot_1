bot:
  name: "ZerodhaBot"
  version: "1.0.0"
  mode: "paper"                    # paper | semi_auto | live
  timezone: "Asia/Kolkata"
  log_level: "INFO"
  log_dir: "journaling/logs"

account:
  starting_capital: 200000
  currency: "INR"
  persist_state_to: "journaling/account_state.json"

capital_tiers:
  auto_detect: true
  notify_on_tier_change: true

risk:
  # null = use tier defaults (recommended — scales with capital automatically)
  risk_per_trade_pct: null
  daily_loss_pct: null
  weekly_dd_pct: null
  monthly_dd_pct: null
  deployment_pct: null
  max_per_trade_pct: null
  max_trades_per_day: null
  max_open_positions: null
  # Always set explicitly
  min_rr_ratio: 1.5
  cooldown_minutes_after_loss: 30
  consecutive_loss_halt: 3
  min_trade_value: 2000
  size_reduction_after_losses: 0.50
  setup_quality_min: "B"
  vix_reduce_threshold: 22.0   # cautious sizing above this
  vix_halt_threshold: 28.0     # no new trades above this
  vix_kill_threshold: 35.0     # close all positions above this

strategy:
  active:
    - "orb"
    - "ema_pullback"
    - "ema_breakdown"
    - "mean_reversion"
    # etf_momentum disabled — backtests show consistent losses (win rate 34%, PF 0.66)
  primary_timeframe: "15m"
  daily_trend_filter: true
  no_trade_before_ist: "09:45"
  no_trade_after_ist: "14:45"
  force_exit_ist: "15:15"

market_research:
  universe: "NIFTY_200"
  etf_symbols:
    - "NIFTYBEES"
    - "BANKBEES"
    - "GOLDBEES"
    - "JUNIORBEES"
    - "ITBEES"
  # Preferred symbols — blended: 5yr backtest (2021-2026) + recent 58-day 15m scan (Feb-Apr 2026)
  # Recent scan: mean_reversion only (EMA/ORB had 0 signals — sideways market)
  # Removed from old list: TITAGARH(-3316), RVNL(-810), SRF(-4520), RAYMOND(-23),
  #   PRESTIGE(-722), VEDL(-1093), CUMMINSIND(-306), DIXON(-198), SCHAEFFLER(-1886),
  #   INDUSTOWER(-233), WELCORP(+111), HUDCO(-1550), CRISIL(-1522), SBIN(-613), BAJAJHLDNG(+273)
  preferred_symbols:
    - "ONGC"         # 5yr+recent: 60% WR, Sharpe 7.2, recent +1529
    - "BHEL"         # 5yr+recent: 50% WR, Sharpe 3.3, recent +1362
    - "KPRMILL"      # 5yr+recent: 50% WR, Sharpe 3.6, recent +1354
    - "COFORGE"      # 5yr+recent: 42% WR, Sharpe ok,  recent +970
    - "NBCC"         # 5yr+recent: 47% WR, Sharpe ok,  recent +969
    - "ZENTEC"       # recent #1:  73% WR, Sharpe 14.5, +4076
    - "USHAMART"     # recent #2:  65% WR, Sharpe 8.7,  +3731
    - "IRB"          # recent #3:  75% WR, Sharpe 9.5,  +3600
    - "PRAJIND"      # recent #4:  64% WR, Sharpe 7.1,  +2772
    - "KALYANKJIL"   # recent #5:  53% WR, Sharpe 5.4,  +2516
    - "ATUL"         # recent #6:  78% WR, Sharpe 10.0, +2309
    - "UNIONBANK"    # recent #7:  55% WR, Sharpe 5.0,  +2049
    - "RITES"        # recent #8:  63% WR, Sharpe 4.4,  +1997
    - "PIIND"        # recent #9:  50% WR, Sharpe 5.0,  +1800
    - "TITAN"        # recent #10: 50% WR, Sharpe 4.9,  +1789
    - "RAILTEL"      # recent #11: 44% WR, Sharpe 3.2,  +1698
    - "KEI"          # recent #13: 57% WR, Sharpe 8.9,  +1588
    - "BRIGADE"      # recent #15: 50% WR, Sharpe 4.9,  +1528
    - "IDBI"         # recent #16: 67% WR, Sharpe 5.7,  +1418
    - "DIVISLAB"     # recent #20: 56% WR, Sharpe 5.4,  +1329
    # Hard avoid: HDFCBANK, BIOCON, IGL, CONCOR, ABFRL, SYNGENE, AMBUJACEM
    # Recent avoid: SRF(-4520), MMTC(-4816), TCS(-3546), EICHERMOT(-3100), TCIEXP(-3072)
  universe_size: 200
  max_watchlist_size: 30
  max_active_candidates: 30
  min_score_for_watchlist: 60
  min_avg_daily_turnover: 50000000
  min_avg_daily_volume: 200000
  min_price: 50
  max_price: 10000
  min_atr_pct: 0.5
  max_atr_pct: 5.0
  vix_reduce_threshold: 22.0
  vix_halt_threshold: 28.0
  vix_kill_threshold: 35.0
  nifty_fall_halt_pct: -1.5
  nifty_fall_kill_pct: -2.5
  watchlist_refresh_times_ist:
    - "09:20"
    - "10:00"
    - "14:00"
  avoid_event_within_days: 3

  # ── News sentiment (ET RSS) ──────────────────────────────────────
  news_sentiment_enabled: true
  sentiment_cache_ttl_minutes: 30
  sentiment_negative_threshold: -0.3   # flag symbol if score below this
  sentiment_positive_boost: 0.4        # boost score if above this (+8 pts)

  # ── Screener.in fundamentals ─────────────────────────────────────
  screener_fundamentals_enabled: true
  fundamentals_cache_ttl_hours: 24
  screener_max_debt_equity: 0.5        # D/E > 0.5 → penalty (-10 pts)
  screener_min_promoter_pct: 25.0      # promoter < 25% → penalty (-10 pts); 50%+ = ideal but many good stocks are 30-50%
  screener_require_positive_earnings: true  # any loss quarter → penalty

data:
  provider_mode: "zerodha_with_fallback"  # free_only | zerodha | zerodha_with_fallback
  cache_dir: ".cache/market_data"
  cache_expiry_minutes: 15
  historical_lookback_days: 365
  intraday_lookback_days: 3

notifications:
  enabled: true
  telegram_bot_token: ""
  telegram_chat_id: ""
  notify_on:
    - trade_entry
    - trade_exit
    - kill_switch
    - tier_change
    - daily_summary
    - api_error

reporting:
  journal_dir: "journaling/logs"
  report_dir: "reporting/output"
  daily_report_time_ist: "15:45"
  save_rejected_trades: true

options:
  enabled: true              # Paper mode only — live options need separate F&O setup
  capital_pct: 0.10          # 10% of total capital per options trade (e.g. Rs.20k at Rs.2L)
  # Grade-A signals only: RSI > 65 + volume >= 2x → buy NIFTY weekly ATM CE (long) or PE (short)
  # Lot size: 25 | Strike: ATM rounded to nearest 50 | Estimated premium: 0.4% of NIFTY spot
  # P&L simulation: delta=0.5, stock-to-NIFTY correlation=0.35
  # Exits: 50% at equity T1, remaining at equity full exit
  max_concurrent_positions: 3

backtesting:
  default_start: "2022-01-01"
  default_end: "2024-01-01"
  slippage_pct: 0.10
  commission_per_order: 20.0
  results_dir: "backtesting/results"

dashboard:
  enabled: true
  host: "localhost"
  port: 8501
  auto_refresh_seconds: 30
